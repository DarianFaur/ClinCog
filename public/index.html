<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark">
<script src="/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClinCog · Clinical Cognition — Conceptualization and Assessment</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>
  // If this student already has a name saved on this device, skip the
  // gate entirely and go straight to the dashboard - before anything
  // even paints, so there's no flash of the form for returning visitors.
  if (localStorage.getItem("clincog_name")) {
    location.replace("/dashboard.html");
  }
</script>
</head>
<body class="bg-mesh">

<main class="splash-page">
  <div class="splash-card">
  <img class="splash-mark" src="/brain-logo-full.png" alt="ClinCog" />

  <h1>ClinCog</h1>
  <p class="tagline">Clinical Cognition — Conceptualization &amp; Assessment</p>

  <form class="splash-form" id="name-form">
    <input id="name-input" type="text" placeholder="Your first name" autocomplete="off" autofocus />
    <button type="submit" class="btn btn-primary">Continue</button>
  </form>

  <a class="splash-help" href="/help.html">Need help getting started?</a>
  </div>
</main>

<script src="/storage.js"></script>
<script>
  document.getElementById("name-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("name-input").value.trim();
    if (!name) return;
    ClinCog.setName(name);
    location.href = "/dashboard.html";
  });
</script>

<script src="/a11y.js"></script>
</body>
</html>
