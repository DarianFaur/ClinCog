name = "clincog"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "clincog.net", custom_domain = true },
  { pattern = "www.clincog.net", custom_domain = true },
  { pattern = "uvt.clincog.net", custom_domain = true },
  { pattern = "admin.clincog.net", custom_domain = true }
]

workers_dev = true
preview_urls = true

# Rate limiting for the public API routes. This is a coarse volume
# backstop, not the primary anti-abuse layer - Turnstile (verified on
# every single chat request, see worker.js) is what actually filters
# out non-human traffic.
#
# CHAT_RATE_LIMITER: student traffic (uvt.clincog.net) and adopted-BYOK
# traffic on the root domain - neither costs the author's own budget, so
# this is set generously high so a full classroom on shared WiFi never
# gets throttled. A real scripted abuser sending hundreds of requests per
# minute would still hit this ceiling, and would be rejected by Turnstile
# on every request regardless.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 200, period = 60 }

# CHAT_RATE_LIMITER_DEMO: root-domain visitors who have NOT entered their
# own key - this spends the author's own demo budget, so it's deliberately
# strict, matched to Gemini's own free-tier ceiling. Multiple 2026 sources
# converge on 10-15 requests/minute for Flash-tier models on the free tier
# (exact figure for gemini-3.5-flash specifically wasn't pinned by a single
# authoritative source at time of writing) - set to 10, the conservative
# end of that range, so our own limiter always triggers before Gemini's
# does, keeping the friendlier in-app message as the one users actually see.
[[ratelimits]]
name = "CHAT_RATE_LIMITER_DEMO"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# ICD-11 lookups are free, so there's no budget reason to tier this one -
# same generous ceiling for every visitor, purely an abuse backstop.
[[ratelimits]]
name = "ICD_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 200, period = 60 }

# CONTACT_RATE_LIMITER: the contact form. Unlike the API routes this is not
# a volume backstop but the actual anti-spam ceiling, so it is strict - a
# person writing in good faith sends one message, not three a minute.
# Turnstile still runs on every submission on top of this.
#
# period only accepts 10 or 60 seconds; a longer window is not expressible
# here, so the ceiling is per minute rather than per ten minutes.
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 2, period = 60 }

# Outbound mail for the contact form. Cloudflare Email Routing only, no
# third-party provider and no API key: sending to a destination address
# verified on the account is free on every plan and does not count against
# any quota. The binding is pinned to that one address rather than left
# unrestricted, so the Worker cannot be made to mail anywhere else even if
# the endpoint itself were compromised.
#
# SELF-HOSTING: change this to your own address, and verify it first under
# Compute > Email Service > Email Routing > Destination Addresses. It has to
# match the CONTACT_TO secret. The address appears twice because Cloudflare
# does not let the Worker read back the destination pinned to a binding, and
# pinning is what stops the Worker mailing anywhere else - worth one repeated
# line. Leaving someone else's address here simply breaks sending: bindings
# are per-account, so an address verified on another account is rejected.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "darian.faur@e-uvt.ro"

[assets]
directory = "./public"
binding = "ASSETS"
# Every request runs worker.js first, static files included. Without this,
# Cloudflare serves any file that exists in ./public straight from the asset
# store and the Worker never sees the request - so on uvt.clincog.net the
# pages and chat.js loaded without the seminar password, and cancelling the
# prompt still left a working app. The gate in worker.js now covers them.
run_worker_first = true

# ---- Per-student quota on the seminar instance (uvt.clincog.net) ----------
# Each student signs in with their student number as the username. The
# class list, limits, periods and password are managed on the admin
# console (admin.clincog.net > Seminar settings) and kept in SEMINAR_CONFIG.
# Every chat exchange is counted on the server against that number, one
# Durable Object per student and period, so neither another device nor the
# in-app "restart progress" gives a student more exchanges than allowed.
[[durable_objects.bindings]]
name = "STUDENT_QUOTA"
class_name = "StudentQuota"

[[migrations]]
tag = "v1-student-quota"
new_sqlite_classes = ["StudentQuota"]

# ---- Usage monitoring for the admin console (admin.clincog.net) -------------
# One Durable Object records every chat reply (tokens, cost, who, which case)
# and streams it live to the monitoring page. Sign-in: the ADMIN_USER and
# ADMIN_PASSWORD secrets.
[[durable_objects.bindings]]
name = "USAGE_MONITOR"
class_name = "UsageMonitor"

[[migrations]]
tag = "v2-usage-monitor"
new_sqlite_classes = ["UsageMonitor"]

# The seminar settings edited on the admin console.
[[durable_objects.bindings]]
name = "SEMINAR_CONFIG"
class_name = "SeminarConfig"

[[migrations]]
tag = "v3-seminar-config"
new_sqlite_classes = ["SeminarConfig"]

[vars]
# Starting values only: read once, the first time the seminar settings are
# opened, together with the STUDENT_IDS secret if it is set. After that the
# admin console is the place to change them.
STUDENT_CASE_LIMIT = "20"
QUOTA_PERIOD = "2026-27-S1"
# Set to "true" while the demo Gemini key is on Google's free tier: the
# console then labels Gemini costs as what they would be on the paid tier.
GEMINI_FREE_TIER = "true"
